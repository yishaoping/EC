# Historical Native reference only. Physical Manager operations remain disabled.
run_farm:
  base_recipe: run-farm-recipes/externally_provisioned.yaml
  recipe_arg_overrides:
    default_platform: XilinxAlveoU280InstanceDeployManager
    default_simulation_dir: /data1/gzh/EC/firesim/deploy/runs
    run_farm_hosts_to_use:
    - localhost: one_fpgas_spec
metasimulation:
  metasimulation_enabled: false
  metasimulation_host_simulator: verilator
  metasimulation_only_plusargs: +fesvr-step-size=128 +max-cycles=100000000
  metasimulation_only_vcs_plusargs: +vcs+initreg+0 +vcs+initmem+0
target_config:
  topology: no_net_config
  no_net_num_nodes: 1
  link_latency: 6405
  switching_latency: 10
  net_bandwidth: 200
  profile_interval: -1
  default_hw_config: legacy_native_v5
  plusarg_passthrough: +mm_readLatency_0=30 +mm_readMaxReqs_0=4 +mm_relaxFunctionalModel_0=0
    +mm_writeLatency_0=30 +mm_writeMaxReqs_0=4
tracing:
  enable: false
  output_format: 0
  selector: 1
  start: 0
  end: -1
autocounter:
  read_rate: 0
workload:
  workload_name: legacy-native-ferret.json
  terminate_on_completion: false
  suffix_tag: null
host_debug:
  zero_out_dram: false
  disable_synth_asserts: false
synth_print:
  start: 0
  end: -1
  cycle_prefix: true
